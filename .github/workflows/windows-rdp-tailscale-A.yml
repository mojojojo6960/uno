# =============================================================================
# Windows RDP via Tailscale (self-chaining)  -  v2
# -----------------------------------------------------------------------------
# One file, no A/B pair. Each run ends ~345 min after it starts and dispatches
# the same workflow again, so a fresh runner takes over (about 5 min gap).
#
# REQUIRED repository secrets  (Settings > Secrets and variables > Actions):
#   TS_AUTHKEY   Tailscale auth key (reusable; ephemeral recommended)
#   TS_API_KEY   Tailscale API key  (only used to remove the stale device that
#                holds the hostname, so the hostname stays "bullet")
#   RDP_PASS     Password for the RDP user
#
# OPTIONAL secret:
#   GH_PAT       Classic PAT (repo + workflow). Only needed if dispatching the
#                next run with the built-in token ever fails.
#
# Order matters: ExpressVPN is installed BEFORE Tailscale comes up, because its
# installer resets the network stack and would otherwise drop Tailscale.
#
# Connect with:  Tailscale ON on your device -> RDP to the IP printed in the
# "Tailscale up" step, or to the name  bullet  (MagicDNS).  The IP changes on
# every run; the name does not.
#
# Stop the chain: cancel the running job AND the pending one, or start it with
# loops = 1.
# =============================================================================

name: Windows RDP via Tailscale

on:
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: "Minutes to stay alive, counted from job start (6-350)"
        required: false
        default: "345"
      loops:
        description: "Runs to chain (0 = infinite, 1 = this run only)"
        required: false
        default: "0"
      install_expressvpn:
        description: "Install ExpressVPN (you log in over RDP)"
        type: boolean
        default: true
      test_mode:
        description: "Test: stay alive only 5 minutes"
        type: boolean
        default: false

# Only one run at a time; the next run waits until this one has finished.
concurrency:
  group: tailscale-rdp-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # needed to dispatch the next run

defaults:
  run:
    shell: pwsh

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 360 # hard cap for GitHub-hosted runners
    env:
      RDP_USER: HolySpider
      TS_HOSTNAME: bullet
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      RDP_PASS: ${{ secrets.RDP_PASS }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Validate secrets + resolve inputs
      # -----------------------------------------------------------------------
      - name: Resolve settings
        id: cfg
        env:
          RAW_RUNTIME: ${{ inputs.runtime_minutes }}
          RAW_LOOPS: ${{ inputs.loops }}
          RAW_TEST: ${{ inputs.test_mode }}
          RAW_EVPN: ${{ inputs.install_expressvpn }}
        run: |
          foreach ($n in 'TS_AUTHKEY','TS_API_KEY','RDP_PASS') {
            if ([string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($n))) {
              throw "Missing repository secret: $n"
            }
          }

          function ToIntOr($v, $def) { if ("$v" -match '^\d+$') { [int]$v } else { [int]$def } }

          $isTest = ("$env:RAW_TEST" -match '^(?i:true|1|yes|on)$')
          $doEvpn = ("$env:RAW_EVPN" -match '^(?i:true|1|yes|on)$')

          $runtime = ToIntOr $env:RAW_RUNTIME 345
          if ($runtime -lt 6)   { $runtime = 345 }
          if ($runtime -gt 350) { $runtime = 350 }   # leave room before the 360-min cap

          $loops = ToIntOr $env:RAW_LOOPS 0
          $start = [DateTime]::UtcNow.ToString('o')

          "runtime=$runtime"                     | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "loops=$loops"                         | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "test=$($isTest.ToString().ToLower())" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "evpn=$($doEvpn.ToString().ToLower())" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "start=$start"                         | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "runtime=$runtime min, loops=$loops, test=$isTest, expressvpn=$doEvpn"

      # -----------------------------------------------------------------------
      # 2. RDP user + service
      # -----------------------------------------------------------------------
      - name: Enable RDP
        run: |
          $u   = $env:RDP_USER
          $sec = ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force

          if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires -PasswordNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name $u -Password $sec -PasswordNeverExpires $true
            Enable-LocalUser -Name $u
          }
          foreach ($g in 'Administrators','Remote Desktop Users') {
            try { Add-LocalGroupMember -Group $g -Member $u -ErrorAction Stop } catch { Write-Host "($u already in $g)" }
          }

          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name PortNumber -Value 3389
          Set-Service TermService -StartupType Automatic
          Restart-Service TermService -Force
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-NetFirewallRule -DisplayGroup 'Remote Desktop' -Profile Any -RemoteAddress Any
          Write-Host "RDP enabled for $u"

      # -----------------------------------------------------------------------
      # 3. Install Tailscale (do not start it yet)
      # -----------------------------------------------------------------------
      - name: Install Tailscale
        run: |
          $exe = 'C:\Program Files\Tailscale\tailscale.exe'
          if (-not (Test-Path $exe)) {
            $dst = Join-Path $env:TEMP 'tailscale-setup.exe'
            Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -OutFile $dst -UseBasicParsing
            Start-Process -FilePath $dst -ArgumentList '/quiet' -Wait
          }
          for ($i = 0; $i -lt 30 -and -not (Test-Path $exe); $i++) { Start-Sleep 2 }
          if (-not (Test-Path $exe)) { throw 'Tailscale did not install' }
          & $exe version

      # -----------------------------------------------------------------------
      # 4. ExpressVPN BEFORE Tailscale comes up (its installer resets the
      #    network stack). Failure here never breaks the chain.
      # -----------------------------------------------------------------------
      - name: Install winget
        if: ${{ steps.cfg.outputs.evpn == 'true' }}
        continue-on-error: true
        uses: Cyberboss/install-winget@v1
        with:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install ExpressVPN
        if: ${{ steps.cfg.outputs.evpn == 'true' }}
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { Write-Warning 'winget not available'; exit 0 }

          winget install --id ExpressVPN.ExpressVPN --exact --source winget --silent `
            --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { Write-Warning "winget exit code: $LASTEXITCODE" }
          Start-Sleep 30

          $exe = @(
            'C:\Program Files\ExpressVPN\expressvpn-ui\ExpressVPN.exe',
            'C:\Program Files (x86)\ExpressVPN\expressvpn-ui\ExpressVPN.exe',
            'C:\Program Files\ExpressVPN\ExpressVPN.exe',
            'C:\Program Files (x86)\ExpressVPN\ExpressVPN.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($exe) {
            $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut("$env:PUBLIC\Desktop\ExpressVPN.lnk")
            $lnk.TargetPath = $exe
            $lnk.Save()
            Write-Host "ExpressVPN installed: $exe (desktop shortcut created, log in over RDP)"
          } else {
            Write-Warning 'ExpressVPN executable not found after install'
          }

          # let the network stack settle before Tailscale starts
          Start-Sleep 20
          Write-Host 'Network settle wait done'

      # -----------------------------------------------------------------------
      # 5. Tailscale up
      # -----------------------------------------------------------------------
      - name: Tailscale up
        id: up
        run: |
          $exe = 'C:\Program Files\Tailscale\tailscale.exe'

          for ($i = 0; $i -lt 30; $i++) {
            $svc = Get-Service Tailscale -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -eq 'Running') { break }
            Start-Service Tailscale -ErrorAction SilentlyContinue
            Start-Sleep 2
          }

          # Remove a stale device that still owns the hostname (previous run),
          # otherwise this one would become "bullet-1".
          try {
            $pair = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($env:TS_API_KEY):"))
            $h    = @{ Authorization = "Basic $pair" }
            $devs = (Invoke-RestMethod -Uri 'https://api.tailscale.com/api/v2/tailnet/-/devices' -Headers $h).devices
            foreach ($d in @($devs | Where-Object { $_.hostname -eq $env:TS_HOSTNAME })) {
              Invoke-RestMethod -Method Delete -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" -Headers $h | Out-Null
              Write-Host "Removed stale device $($d.name)"
            }
          } catch {
            Write-Warning "Stale-device cleanup skipped: $($_.Exception.Message)"
          }

          & $exe up --authkey="$env:TS_AUTHKEY" --hostname="$env:TS_HOSTNAME" --accept-routes --accept-dns=false --unattended
          if ($LASTEXITCODE -ne 0) { throw "tailscale up failed ($LASTEXITCODE)" }

          $ip4 = $null
          for ($i = 0; $i -lt 30 -and -not $ip4; $i++) {
            $ip4 = (& $exe ip -4 2>$null | Select-Object -First 1)
            if (-not $ip4) { Start-Sleep 1 }
          }
          if (-not $ip4) { throw 'No Tailscale IPv4 assigned' }
          $self = (& $exe status --json | ConvertFrom-Json).Self

          "ip4=$ip4" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host '=============================='
          Write-Host '  RDP READY'
          Write-Host "  Address : ${ip4}:3389"
          Write-Host "  Name    : $($self.DNSName)"
          Write-Host "  User    : $($env:RDP_USER)   (password = RDP_PASS secret)"
          Write-Host '=============================='

      # -----------------------------------------------------------------------
      # 6. Allow RDP on the Tailscale interface + print diagnostics
      # -----------------------------------------------------------------------
      - name: RDP firewall + diagnostics
        continue-on-error: true
        run: |
          Get-NetFirewallRule -DisplayName 'RDP Tailscale' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          New-NetFirewallRule -DisplayName 'RDP Tailscale' -Direction Inbound -Protocol TCP -LocalPort 3389 `
            -Action Allow -Profile Any -InterfaceAlias 'Tailscale' | Out-Null

          '--- TermService : ' + (Get-Service TermService).Status
          '--- Listening   :'; netstat -ano | Select-String ':3389'
          '--- Local test  :'; Test-NetConnection localhost -Port 3389 | Select-Object TcpTestSucceeded
          '--- Adapters    :'; Get-NetAdapter | Format-Table Name,Status
          '--- Tailscale   :'; & 'C:\Program Files\Tailscale\tailscale.exe' status

      # -----------------------------------------------------------------------
      # 7. Keep alive until (job start + runtime), with a Tailscale watchdog
      # -----------------------------------------------------------------------
      - name: Keep alive
        id: keep
        env:
          START: ${{ steps.cfg.outputs.start }}
          RUNTIME: ${{ steps.cfg.outputs.runtime }}
          TEST: ${{ steps.cfg.outputs.test }}
        run: |
          $exe = 'C:\Program Files\Tailscale\tailscale.exe'
          if ($env:TEST -eq 'true') {
            $end = [DateTime]::UtcNow.AddMinutes(5)
          } else {
            $start = [DateTime]::Parse($env:START, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::RoundtripKind)
            $end   = $start.AddMinutes([int]$env:RUNTIME)
          }
          Write-Host "Keep alive until $($end.ToString('u'))"

          $i = 0
          while ([DateTime]::UtcNow -lt $end) {
            Start-Sleep -Seconds ([Math]::Min(60, [Math]::Max(1, [int]($end - [DateTime]::UtcNow).TotalSeconds)))
            $i++
            try {
              $ip = (& $exe ip -4 2>$null | Select-Object -First 1)
              if (-not $ip) {
                Write-Warning 'Tailscale is down - reconnecting'
                Start-Service Tailscale -ErrorAction SilentlyContinue
                & $exe up --authkey="$env:TS_AUTHKEY" --hostname="$env:TS_HOSTNAME" --accept-routes --accept-dns=false --unattended
                $ip = (& $exe ip -4 2>$null | Select-Object -First 1)
                Write-Host "Reconnected, ip=$ip"
              }
            } catch {
              Write-Warning "watchdog error: $($_.Exception.Message)"
            }
            if ($i % 5 -eq 0) {
              $left = [int]($end - [DateTime]::UtcNow).TotalMinutes
              Write-Host "[heartbeat] $left min left, tailscale ip=$ip"
            }
          }
          Write-Host 'Keep alive finished.'

      # -----------------------------------------------------------------------
      # 8. Hand off to the next run - ONLY when keep-alive completed normally
      # -----------------------------------------------------------------------
      - name: Dispatch next run
        if: ${{ success() && steps.keep.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          WF_REF: ${{ github.workflow_ref }}
          REF_NAME: ${{ github.ref_name }}
          LOOPS: ${{ steps.cfg.outputs.loops }}
          RUNTIME: ${{ steps.cfg.outputs.runtime }}
          EVPN: ${{ steps.cfg.outputs.evpn }}
        run: |
          $loops = [int]$env:LOOPS
          if ($loops -eq 1) { Write-Host 'loops=1: last run, not dispatching.'; exit 0 }
          $next = if ($loops -gt 1) { $loops - 1 } else { 0 }

          # workflow_ref = owner/repo/.github/workflows/<file>.yml@refs/heads/<branch>
          $wf = Split-Path (($env:WF_REF -split '@')[0]) -Leaf
          Write-Host "Dispatching $wf on $($env:REF_NAME) (loops -> $next)"

          $done = $false
          for ($try = 1; $try -le 3 -and -not $done; $try++) {
            gh workflow run $wf --repo $env:GITHUB_REPOSITORY --ref $env:REF_NAME `
              -f "runtime_minutes=$($env:RUNTIME)" -f "loops=$next" `
              -f "install_expressvpn=$($env:EVPN)" -f 'test_mode=false'
            if ($LASTEXITCODE -eq 0) { $done = $true } else { Write-Warning "dispatch attempt $try failed"; Start-Sleep 10 }
          }
          if (-not $done) { throw 'Could not dispatch the next run' }

      # -----------------------------------------------------------------------
      # 9. Release the tailnet device so the next run can reuse the hostname
      # -----------------------------------------------------------------------
      - name: Tailscale logout
        if: always()
        run: |
          $exe = 'C:\Program Files\Tailscale\tailscale.exe'
          if (Test-Path $exe) { & $exe logout 2>&1 | Out-Null }
          exit 0
