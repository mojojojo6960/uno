# =============================================================================
# Windows RDP via Tailscale (A)
# -----------------------------------------------------------------------------
# ⚠️  EXPRESSVPN CAVEATS (READ BEFORE USING):
#   1. ExpressVPN has NO official Windows CLI. This workflow installs it,
#      launches the GUI, and attempts a best-effort `--activate`/`connect`.
#      Most builds will require you to finish activation manually over RDP.
#   2. ExpressVPN's kill-switch WILL drop your RDP session once active unless
#      you whitelist the Tailscale interface. This workflow attempts to add
#      the exclusion, but it may not stick on all builds.
#   3. GitHub-hosted Windows runners frequently CANNOT reach ExpressVPN
#      endpoints (Azure IPs are blocked/throttled). Expect failures.
#   4. Using GH runners as long-lived VPN + RDP endpoints violates GitHub's
#      Acceptable Use Policies. You have been warned.
# =============================================================================

name: Windows RDP via Tailscale (A)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true
      ts_api_key:
        description: "Tailscale API key (device admin, no 'Bearer')"
        required: true
      ts_authkey:
        description: "Tailscale auth key (reusable or ephemeral)"
        required: true
      gh_api_token:
        description: "GitHub Personal Access Token (classic; scopes: repo, workflow)"
        required: true
      test_mode:
        description: "Run 5-minute test loop"
        type: boolean
        default: false
      runtime_minutes:
        description: "Runtime in minutes (max 360; capped to 355)"
        required: false
        default: "355"
      loops:
        description: "How many handoffs (0 = infinite)"
        required: false
        default: "0"
      # --- ExpressVPN inputs (optional) ---
      evpn_activate_code:
        description: "ExpressVPN activation code (from account page)"
        required: false
        default: ""
      evpn_username:
        description: "ExpressVPN account email (for reference / RDP login)"
        required: false
        default: ""
      evpn_password:
        description: "ExpressVPN account password (for reference / RDP login)"
        required: false
        default: ""
      evpn_server:
        description: "Preferred ExpressVPN server (e.g. 'smart', 'usa-new_york-1')"
        required: false
        default: "smart"

concurrency:
  group: tailscale-rdp-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

env:
  RDP_USER: HolySpider
  RDP_PASS: Spider12345
  TS_HOSTNAME: bullet

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 370

    steps:
      # ---------------------------------------------------------------------
      # 1. Resolve inputs
      # ---------------------------------------------------------------------
      - name: 🔧 Resolve inputs (safe)
        id: cfg
        env:
          RAW_TAILNET: ${{ inputs.ts_tailnet }}
          RAW_APIKEY: ${{ inputs.ts_api_key }}
          RAW_AUTHKEY: ${{ inputs.ts_authkey }}
          RAW_PAT: ${{ inputs.gh_api_token }}
          RAW_TEST: ${{ inputs.test_mode == true && 'true' || 'false' }}
          RAW_RUNTIME: ${{ inputs.runtime_minutes || '355' }}
          RAW_LOOPS: ${{ inputs.loops || '0' }}
          RAW_EVPN_CODE: ${{ inputs.evpn_activate_code }}
          RAW_EVPN_USER: ${{ inputs.evpn_username }}
          RAW_EVPN_PASS: ${{ inputs.evpn_password }}
          RAW_EVPN_SRV: ${{ inputs.evpn_server || 'smart' }}
        run: |
          function ToIntOr($v, $def) {
            if ("$v" -match '^\d+$') { [int]$v } else { [int]$def }
          }

          $tailnet = $env:RAW_TAILNET
          $apiKey  = $env:RAW_APIKEY
          $authKey = $env:RAW_AUTHKEY
          $pat     = $env:RAW_PAT

          if (-not $tailnet -or -not $apiKey -or -not $authKey -or -not $pat) {
            Write-Error "Missing required inputs"
            exit 1
          }

          $isTest = ($env:RAW_TEST -match '^(?i:true|1|yes|on)$')

          $runtime = ToIntOr $env:RAW_RUNTIME 355
          if ($isTest) { $runtime = 5 }

          if (-not $isTest -and $runtime -lt 6) { $runtime = 355 }
          if ($runtime -gt 360) { $runtime = 355 }

          $loops = ToIntOr $env:RAW_LOOPS 0
          if ($loops -lt 0) { $loops = 0 }

          "tailnet=$tailnet" | Out-File -Append $env:GITHUB_OUTPUT
          "apikey=$apiKey"   | Out-File -Append $env:GITHUB_OUTPUT
          "authkey=$authKey" | Out-File -Append $env:GITHUB_OUTPUT
          "pat=$pat"         | Out-File -Append $env:GITHUB_OUTPUT
          "runtime=$runtime" | Out-File -Append $env:GITHUB_OUTPUT
          "loops=$loops"     | Out-File -Append $env:GITHUB_OUTPUT

          # ExpressVPN (optional)
          "evpn_code=$env:RAW_EVPN_CODE" | Out-File -Append $env:GITHUB_OUTPUT
          "evpn_user=$env:RAW_EVPN_USER" | Out-File -Append $env:GITHUB_OUTPUT
          "evpn_pass=$env:RAW_EVPN_PASS" | Out-File -Append $env:GITHUB_OUTPUT
          "evpn_srv=$env:RAW_EVPN_SRV"   | Out-File -Append $env:GITHUB_OUTPUT

      # ---------------------------------------------------------------------
      # 2. Install Tailscale
      # ---------------------------------------------------------------------
      - name: ⚙️ Install Tailscale
        run: |
          $exe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $exe)) {
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
            $dst = "$env:TEMP\tailscale-setup.exe"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            Start-Process -FilePath $dst -ArgumentList "/quiet" -Wait
          }
          Start-Service Tailscale -ErrorAction SilentlyContinue
          & $exe version

      # ---------------------------------------------------------------------
      # 3. Enable RDP user + firewall
      # ---------------------------------------------------------------------
      - name: 🔐 Enable RDP user + firewall
        run: |
          $u="${{ env.RDP_USER }}"
          $p="${{ env.RDP_PASS }}"
          $sec = ConvertTo-SecureString $p -AsPlainText -Force

          if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group Administrators -Member $u
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
          } else {
            Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Enable-LocalUser -Name $u
          }

          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      # ---------------------------------------------------------------------
      # 4. Tailscale up
      # ---------------------------------------------------------------------
      - name: 🔗 Tailscale up
        id: up
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          & $ts logout | Out-Null
          & $ts up --authkey "${{ steps.cfg.outputs.authkey }}" --hostname "${{ env.TS_HOSTNAME }}" --accept-routes --accept-dns=false

          Start-Sleep -Seconds 3

          $ip4 = (& $ts ip -4 | Select-Object -First 1)
          $status = & $ts status --json | ConvertFrom-Json
          $fqdn = $status.Self.DNSName
          $derp = $status.Self.DERP

          "ip4=$ip4"   | Out-File -Append $env:GITHUB_OUTPUT
          "fqdn=$fqdn" | Out-File -Append $env:GITHUB_OUTPUT
          "derp=$derp" | Out-File -Append $env:GITHUB_OUTPUT

      # ---------------------------------------------------------------------
      # 5. ExpressVPN install + best-effort activate (OPTIONAL)
      #    Runs only if evpn_activate_code was supplied.
      #    continue-on-error so a VPN failure never kills the RDP session.
      # ---------------------------------------------------------------------
      - name: 🌐 Install & configure ExpressVPN
        id: evpn
        if: ${{ steps.cfg.outputs.evpn_code != '' }}
        continue-on-error: true
        env:
          EVPN_CODE: ${{ steps.cfg.outputs.evpn_code }}
          EVPN_SRV:  ${{ steps.cfg.outputs.evpn_srv }}
        run: |
          $ErrorActionPreference = 'Continue'

          function Log($m) { Write-Host "[evpn] $m" }

          # ---- Kill-switch pre-exclusion for Tailscale ------------------
          # We add Tailscale's interface to the Windows Firewall allow list
          # BEFORE ExpressVPN installs, so its kill-switch is less likely
          # to sever our RDP path.
          try {
            New-NetFirewallRule -DisplayName "Allow Tailscale (ExpressVPN bypass)" `
              -Direction Inbound -Action Allow -Protocol Any `
              -InterfaceAlias "Tailscale" -ErrorAction SilentlyContinue | Out-Null
            Log "Added Tailscale inbound firewall rule."
          } catch { Log "Firewall rule add failed: $_" }

          # ---- Download ------------------------------------------------
          $installer = "$env:TEMP\expressvpn.exe"
          $url = "https://www.expressvpn.works/clients/windows/expressvpn_windows_12.90.0.16_release.exe"
          Log "Downloading ExpressVPN..."
          try {
            Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing -TimeoutSec 180
            Log "Downloaded to $installer"
          } catch {
            Log "Download FAILED: $_"
            exit 0
          }

          # ---- Install silently ---------------------------------------
          Log "Installing ExpressVPN silently..."
          try {
            Start-Process -FilePath $installer -ArgumentList "/S" -Wait -NoNewWindow
            Start-Sleep -Seconds 25
          } catch {
            Log "Installer launch failed: $_"
            exit 0
          }

          # ---- Locate the client EXE ----------------------------------
          $candidates = @(
            "C:\Program Files (x86)\ExpressVPN\expressvpn-ui\ExpressVPN.exe",
            "C:\Program Files\ExpressVPN\expressvpn-ui\ExpressVPN.exe",
            "C:\Program Files (x86)\ExpressVPN\ExpressVPN.exe",
            "C:\Program Files\ExpressVPN\ExpressVPN.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            Log "ExpressVPN client EXE not found. Skipping activation."
            exit 0
          }
          Log "Found client: $exe"
          "exe=$exe" | Out-File -Append $env:GITHUB_OUTPUT

          # ---- Service status -----------------------------------------
          $svc = Get-Service -Name "ExpressVPNService" -ErrorAction SilentlyContinue
          if ($svc) { Log "ExpressVPNService: $($svc.Status)" }

          # ---- Best-effort CLI activation (build-dependent) -----------
          # Some builds accept: ExpressVPN.exe --activate <code>
          # Many do NOT. If it fails, we fall back to GUI-over-RDP.
          Log "Attempting best-effort CLI activation..."
          try {
            & $exe --activate "$env:EVPN_CODE" 2>&1 | ForEach-Object { Log $_ }
          } catch {
            Log "CLI activation not supported on this build: $_"
          }

          # ---- Launch GUI so user can finish over RDP -----------------
          Log "Launching ExpressVPN GUI (finish activation over RDP if needed)."
          try {
            Start-Process -FilePath $exe
            Start-Sleep -Seconds 8
          } catch { Log "GUI launch failed: $_" }

          # ---- Best-effort connect ------------------------------------
          Log "Attempting best-effort connect to '$env:EVPN_SRV'..."
          try {
            & $exe connect "$env:EVPN_SRV" 2>&1 | ForEach-Object { Log $_ }
            Start-Sleep -Seconds 10
          } catch {
            Log "CLI connect not supported on this build: $_"
          }

          # ---- Post-connect status ------------------------------------
          try {
            $adapter = Get-NetAdapter | Where-Object { $_.InterfaceDescription -match "ExpressVPN|TAP" } | Select-Object -First 1
            if ($adapter) {
              Log "VPN adapter: $($adapter.Name) - $($adapter.Status)"
            } else {
              Log "No ExpressVPN TAP adapter visible."
            }
          } catch { Log "Adapter probe failed: $_" }

          Log "ExpressVPN setup step complete (may require manual finish via RDP)."

      # ---------------------------------------------------------------------
      # 6. Keep alive
      # ---------------------------------------------------------------------
      - name: ⏳ Keep alive
        run: |
          $mins=[int]"${{ steps.cfg.outputs.runtime }}"
          $end=(Get-Date).AddMinutes($mins)
          Write-Host "Keeping session alive for $mins minutes (until $end)..."
          while((Get-Date) -lt $end){
            Start-Sleep -Seconds 60
          }

      # ---------------------------------------------------------------------
      # 7. Handoff to workflow B
      # ---------------------------------------------------------------------
      - name: 🔁 Dispatch workflow B
        if: always()
        run: |
          $loops=[int]"${{ steps.cfg.outputs.loops }}"
          if ($loops -eq 1) { exit 0 }
          if ($loops -gt 1) { $next=$loops-1 } else { $next=0 }

          $token="${{ steps.cfg.outputs.pat }}"

          $body=@{
            ref    = "${{ github.ref_name }}"
            inputs = @{
              ts_tailnet         = "${{ steps.cfg.outputs.tailnet }}"
              ts_api_key         = "${{ steps.cfg.outputs.apikey }}"
              ts_authkey         = "${{ steps.cfg.outputs.authkey }}"
              gh_api_token       = "$token"
              test_mode          = "false"
              runtime_minutes    = "${{ steps.cfg.outputs.runtime }}"
              loops              = "$next"
              evpn_activate_code = "${{ steps.cfg.outputs.evpn_code }}"
              evpn_username      = "${{ steps.cfg.outputs.evpn_user }}"
              evpn_password      = "${{ steps.cfg.outputs.evpn_pass }}"
              evpn_server        = "${{ steps.cfg.outputs.evpn_srv }}"
            }
          } | ConvertTo-Json -Depth 5

          Invoke-RestMethod -Method POST `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/windows-rdp-tailscale-B.yml/dispatches" `
            -Headers @{ Authorization = "Bearer $token"; Accept="application/vnd.github+json" } `
            -Body $body
